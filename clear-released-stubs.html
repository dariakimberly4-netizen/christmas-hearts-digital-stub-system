<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#103b2d" />
  <title>Clear Released Stubs</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f0e5;color:#22251f}.card{width:min(520px,100%);background:#fffdf8;border:1px solid #e3dccf;border-radius:22px;padding:24px;box-shadow:0 12px 34px rgba(24,35,28,.11)}h1{margin:0 0 8px;color:#103b2d}p{line-height:1.5}.notice{background:#f5efe2;border:1px solid #e3d5b8;border-radius:14px;padding:14px;margin:16px 0}.btn{width:100%;min-height:56px;border:0;border-radius:13px;background:#103b2d;color:#fff;font:inherit;font-weight:800;padding:14px 18px;cursor:pointer}.btn:disabled{opacity:.5}.status{margin-top:16px;border-radius:14px;padding:14px;background:#edf4ef;color:#103b2d;font-weight:700}.back{display:block;text-align:center;margin-top:15px;color:#103b2d;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Clear Released Stubs</h1>
    <p>Use this on the <b>same phone/browser</b> where the released stubs are showing.</p>
    <div class="notice">This clears only <b>Digital Stub = Released</b>. Registrations, food claims, raffle entries, and staff accounts stay unchanged.</div>
    <button class="btn" id="clearBtn">Clear Released Stubs Now</button>
    <div class="status" id="status">Ready.</div>
    <a class="back" href="./">Back to Event System</a>
  </main>
  <script>
    const ATTENDEES_KEY='christmasHearts2026.attendees.v1';
    const AUDIT_KEY='christmasHearts2026.audit.v1';
    const btn=document.getElementById('clearBtn');
    const status=document.getElementById('status');
    function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
    function save(key,value){localStorage.setItem(key,JSON.stringify(value))}
    btn.addEventListener('click',()=>{
      const attendees=load(ATTENDEES_KEY,[]);
      if(!Array.isArray(attendees)){status.textContent='Could not read attendee data on this browser.';return}
      const released=attendees.filter(a=>a&&a.stubReleasedAt).length;
      if(!released){status.textContent='No released stubs found on this browser. Nothing was changed.';return}
      attendees.forEach(a=>{if(a){a.stubReleasedAt=null;a.stubReleasedBy=null}});
      save(ATTENDEES_KEY,attendees);
      const audit=load(AUDIT_KEY,[]);
      if(Array.isArray(audit)){
        audit.unshift({id:(crypto.randomUUID?.()||String(Date.now())),at:new Date().toISOString(),staff:'Administrator',role:'ADMIN',action:'ALL RELEASED STUBS CLEARED',attendeeId:null,code:'',name:'',details:`${released} released stub(s) reset from local reset page`});
        save(AUDIT_KEY,audit.slice(0,3000));
      }
      status.textContent=`Done — ${released} released stub${released===1?'':'s'} cleared on this browser.`;
      btn.disabled=true;
    });
  </script>
</body>
</html>
