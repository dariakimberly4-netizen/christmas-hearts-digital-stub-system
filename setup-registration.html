<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103b2d"><title>Create Registration Account</title><style>body{font-family:Arial,sans-serif;background:#fffaf0;color:#103b2d;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #e3dccf;border-radius:22px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.08)}h1{margin:0 0 8px}.note{padding:12px;border-radius:14px;background:#f5efe2;color:#4b504a;line-height:1.45;margin:12px 0 18px}label{display:block;font-weight:700;margin:13px 0 6px}input,select{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d8d4ca;border-radius:12px;font-size:16px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#103b2d;color:#fff;font-weight:800;font-size:16px}.status{margin-top:14px;font-weight:700;line-height:1.4}.ok{color:#0f5a35}.bad{color:#9f2430}</style></head><body><main class="card"><h1>Registration Staff Setup</h1><div class="note">Create a separate <b>Registration Encoder</b> account on this device. Your existing Food Claim account stays Food Claim-only.</div><label>Administrator Account</label><select id="admin"></select><label>Administrator PIN</label><input id="adminPin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit Admin PIN"><label>Registration Staff Name</label><input id="regName" value="registration" placeholder="Registration staff name"><label>New Registration PIN</label><input id="regPin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN"><button id="createBtn">Create Registration Account</button><div id="status" class="status"></div></main><script>const KEY='christmasHearts2026.staff.v1';const staff=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}})();const admins=staff.filter(s=>s.role==='ADMIN');const sel=document.getElementById('admin');sel.innerHTML=admins.length?admins.map(s=>`<option value="${s.id}">${s.name}</option>`).join(''):'<option>No Administrator account found</option>';async function hashPin(pin){if(crypto.subtle){const b=new TextEncoder().encode(pin);const d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}return btoa(pin)};document.getElementById('createBtn').onclick=async()=>{const status=document.getElementById('status');status.className='status';if(!admins.length){status.className+=' bad';status.textContent='No Administrator account exists on this device.';return}const admin=admins.find(s=>s.id===sel.value);const ap=document.getElementById('adminPin').value.trim();const name=document.getElementById('regName').value.trim();const pin=document.getElementById('regPin').value.trim();if(!/^\d{4}$/.test(ap)||!/^\d{4}$/.test(pin)||!name){status.className+=' bad';status.textContent='Enter the Admin PIN, staff name, and a 4-digit Registration PIN.';return}if(await hashPin(ap)!==admin.pinHash){status.className+=' bad';status.textContent='Incorrect Administrator PIN.';return}const all=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}})();if(all.some(s=>s.role==='REGISTRATION'&&s.name.toLowerCase()===name.toLowerCase())){status.className+=' bad';status.textContent='A Registration account with this name already exists.';return}all.push({id:crypto.randomUUID?.()||String(Date.now()),name,role:'REGISTRATION',pinHash:await hashPin(pin),createdAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(all));sessionStorage.removeItem('christmasHearts2026.session');status.className+=' ok';status.textContent='Registration account created. Opening the staff login…';setTimeout(()=>location.replace('./?v=29&station=registration'),900)};</script></body></html>
