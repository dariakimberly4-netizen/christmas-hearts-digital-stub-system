<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103b2d"><title>Refreshing Registration</title><style>body{font-family:Arial,sans-serif;background:#fffaf0;color:#103b2d;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}.card{max-width:520px;background:#fff;border:1px solid #e3dccf;border-radius:22px;padding:28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}h1{margin:0 0 12px}p{line-height:1.5;color:#555}.dot{width:46px;height:46px;border:5px solid #e3dccf;border-top-color:#103b2d;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="card"><div class="dot"></div><h1>Refreshing Registration</h1><p>Loading the Registration Encoder-only station…</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}if('serviceWorker'in navigator){await navigator.serviceWorker.register('./sw.js?v=29',{updateViaCache:'none'});await navigator.serviceWorker.ready}setTimeout(()=>location.replace('./?v=29&station=registration&fresh='+Date.now()),700)}catch(e){location.replace('./?v=29&station=registration&fresh='+Date.now())}})();</script></body></html>
